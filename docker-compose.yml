services:
  db:
    image: postgres:16
    container_name: phishguard-db
    environment:
      POSTGRES_USER: fatma
      POSTGRES_PASSWORD: fatma123
      POSTGRES_DB: phishguard
    ports:
      - "5432:5432"
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata: